<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Pack Architect - 2D CAD v4.0</title>
    <script src="https://unpkg.com/konva@9.3.6/konva.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="sidebar">
        <div class="brand">⚡ PACK ARCHITECT</div>

        <div class="panel-section">
            <div class="section-title">工具与视图</div>
            <button id="btn-snap">网格吸附: 关</button>
            <button id="btn-view">当前视角: 正面</button>
            <button id="btn-add-cell" style="margin-top: 10px;">+ 添加单个电芯</button>
        </div>

        <details class="panel-section" open>
            <summary class="section-title" style="cursor: pointer; user-select: none;">
                📦 参数化生成引擎 (点击折叠)
            </summary>
            <div style="margin-top: 15px;">
                <select id="select-layout" class="layout-input"
                    style="width: 100%; margin-bottom: 8px; text-align: left;">
                    <option value="matrix">🔲 标准矩阵 (Matrix)</option>
                    <option value="honeycomb">🍯 横向蜂窝 (Honeycomb)</option>
                    <option value="fishscale">🐟 竖向鱼鳞 (Fish Scale)</option>
                </select>
                <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                    <input type="number" id="input-s" placeholder="S(行)" value="10" min="1" class="layout-input"
                        title="串联/行数">
                    <input type="number" id="input-p" placeholder="P(列)" value="4" min="1" class="layout-input"
                        title="并联/列数">
                </div>
                <button id="btn-generate">⚡ 追加生成并选中</button>
                <button id="btn-clear" class="danger" style="margin-top: 5px;">🗑️ 清空整个画布</button>
            </div>
        </details>

        <div class="panel-section" id="panel-properties"
            style="display: none; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #38bdf8;">
            <div class="section-title" style="color: #38bdf8;">图元属性 (Properties)</div>
            <div style="font-size: 12px; margin-bottom: 10px; color: #cbd5e1; font-weight: bold;"
                id="prop-selection-info">未选中图元</div>
            <div style="display: flex; gap: 10px; margin-bottom: 5px;">
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #94a3b8; display: block; margin-bottom: 3px;">电压 (V)</label>
                    <input type="number" id="prop-voltage" class="layout-input" style="width: 100%; padding: 4px;"
                        step="0.01" placeholder="例如: 3.6">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #94a3b8; display: block; margin-bottom: 3px;">内阻 (mΩ)</label>
                    <input type="number" id="prop-resistance" class="layout-input" style="width: 100%; padding: 4px;"
                        step="0.1" placeholder="例如: 15.2">
                </div>
            </div>
            <div style="font-size: 10px; color: #64748b; margin-top: 5px;">*输入后自动保存，清空可取消显示</div>
        </div>

        <div class="panel-section">
            <div class="section-title">文件与数据</div>
            <button id="btn-export">💾 导出 JSON 项目</button>
            <button id="btn-import">📂 导入 JSON 项目</button>
            <input type="file" id="file-import" accept=".json" style="display: none;">
        </div>

        <div style="font-size: 11px; color: #64748b; line-height: 1.6;">
            <strong>高级快捷键:</strong><br>
            • 鼠标右键/中键：任何工具下平移画布<br>
            • 空白处拖拽：指针模式下平移画布<br>
            • Space(长按) / H键：全局强制抓手<br>
            • Ctrl + 点击：加选/减选电芯<br>
            • K / 🔒：锁定/解锁选中图元<br>
            • Delete：删除选中图元
        </div>
    </div>

    <div id="toolbar">
        <div class="tool-dropdown">
            <button class="tool-btn active" id="tool-pointer" title="默认指针/移动 (V)">👆</button>
            <div class="tool-dropdown-content">
                <button class="tool-btn sub-btn" id="tool-select-box" title="矩形框选 (B)">🔲</button>
                <button class="tool-btn sub-btn" id="tool-select-lasso" title="套索框选 (L)">〽️</button>
                <button class="tool-btn sub-btn" id="tool-polarity" title="极性反转 (P)">🔄</button>
                <button class="tool-btn sub-btn" id="tool-pan" title="全局抓手 (H)">✋</button>
            </div>
        </div>
        <button class="tool-btn" id="tool-wire" title="镍片连线笔 (W)">✏️</button>
        <div class="divider"></div>
        <button class="tool-btn" id="btn-lock" title="锁定/解锁选中图元 (K)">🔒</button>
        <div class="divider"></div>
        <button class="tool-btn" id="btn-undo" title="撤销 (Ctrl+Z)">↩️</button>
        <button class="tool-btn" id="btn-redo" title="重做 (Ctrl+Y)">↪️</button>
    </div>

    <div id="canvas-container">
        <div id="status-bar">
            就绪 | 电芯: <span id="cell-count">0</span> | 连线: <span id="wire-count">0</span>
            <span style="color: #475569; margin: 0 10px;">|</span>
            <span id="save-status" style="color: #38bdf8;">💾 自动保存: 最新</span>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
